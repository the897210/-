<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的運動App</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f2f5; }
        .card { background: white; padding: 15px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        button { background: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; width: 100%; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h2>💪 運動紀錄</h2>
    
    <div class="card">
        <h3>🏋️ 重訓</h3>
        <input type="text" id="exercise" placeholder="動作名稱">
        <input type="number" id="weight" placeholder="重量 (kg)">
        <button onclick="saveLog('重訓')">儲存紀錄</button>
    </div>

    <div class="card">
        <h3>🏃 有氧</h3>
        <input type="text" id="cardio" placeholder="運動類型 (如:跑步)">
        <input type="number" id="minutes" placeholder="時間 (分鐘)">
        <button onclick="saveLog('有氧')">儲存紀錄</button>
    </div>

    <div id="history" class="card">
        <h3>📅 最近紀錄</h3>
        <ul id="logList"></ul>
    </div>

    <script>
        function saveLog(type) {
            const logList = document.getElementById('logList');
            const li = document.createElement('li');
            const now = new Date().toLocaleTimeString();
            li.innerText = `[${now}] ${type} 已儲存`;
            logList.appendChild(li);
            alert(type + ' 紀錄成功！');
        }
    </script>
</body>
</html>
