<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#bb86fc">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <title>💪 專屬健身 App</title>
    <style>
        :root { --bg: #121212; --card: #1e1e1e; --primary: #03dac6; --sec: #bb86fc; --text: #fff; --danger: #cf6679; --highlight: #3700b3; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: env(safe-area-inset-top) 15px 20px 20px; 
            background: var(--bg); color: var(--text); margin: 0; 
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        
        /* 版面配置 */
        .card { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: var(--sec); margin: 10px 0 20px; font-size: 24px; }
        h3 { margin: 0 0 15px; font-size: 18px; color: #eee; border-bottom: 1px solid #333; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        
        /* 輸入框組 */
        .input-group { display: flex; gap: 10px; margin-bottom: 10px; }
        input { 
            width: 100%; padding: 14px; border: 1px solid #444; 
            border-radius: 12px; background: #2c2c2c; color: white; 
            font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--sec); background: #333; }
        
        /* 歷史提示 (上次做多少) */
        #lastRecord { font-size: 13px; color: #aaa; margin-bottom: 10px; font-style: italic; min-height: 18px; }
        #lastRecord span { color: var(--primary); font-weight: bold; }

        /* 按鈕樣式 */
        button { border: none; border-radius: 12px; padding: 14px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .btn-save { background: var(--primary); color: #000; margin-top: 10px; }
        .btn-save:active { opacity: 0.8; transform: scale(0.98); }
        
        /* 計時器區塊 */
        .timer-box { display: flex; gap: 10px; align-items: center; margin-top: 15px; background: #252525; padding: 10px; border-radius: 12px; }
        .timer-display { font-size: 20px; font-family: monospace; color: var(--sec); width: 60px; text-align: center; }
        .btn-timer { background: #444; color: #fff; font-size: 14px; padding: 8px; }
        .timer-active { background: var(--danger) !important; animation: pulse 1s infinite; }

        /* 月曆樣式 */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; text-align: center; }
        .day-name { color: #888; font-size: 12px; margin-bottom: 5px; }
        .day { 
            padding: 10px 0; border-radius: 8px; font-size: 14px; position: relative; cursor: pointer;
        }
        .day.today { border: 1px solid var(--sec); color: var(--sec); }
        .day.has-data { background: rgba(3, 218, 198, 0.15); color: var(--primary); font-weight: bold; }
        .day.has-data::after { content: ''; position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); width: 4px; height: 4px; background: var(--primary); border-radius: 50%; }
        .day.selected { background: var(--sec) !important; color: #000 !important; }
        .day:active { background: #333; }

        /* 列表樣式 */
        #logList { max-height: 400px; overflow-y: auto; }
        .log-item { 
            background: #2a2a2a; padding: 12px; border-radius: 10px; margin-bottom: 8px; 
            border-left: 4px solid var(--sec); display: flex; justify-content: space-between; align-items: center; 
        }
        .log-info { font-size: 14px; line-height: 1.5; color: #ddd; }
        .log-date { font-size: 12px; color: #888; display: block; margin-bottom: 2px; }
        .del-btn { background: none; width: auto; padding: 5px; font-size: 18px; color: #666; }

        /* 彈窗 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 999; backdrop-filter: blur(5px); }
        .modal-content { background: #2a2a2a; padding: 25px; border-radius: 15px; width: 80%; max-width: 300px; text-align: center; border: 1px solid #444; }
        .modal-btns { display: flex; gap: 10px; margin-top: 20px; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.6; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <h2>💪 專屬健身 App</h2>

    <div class="card">
        <h3>🏋️ 重訓紀錄</h3>
        
        <input list="gym-items" id="exercise" placeholder="選擇或輸入動作 (如: 深蹲)" oninput="checkHistory()">
        <datalist id="gym-items">
            <option value="深蹲"><option value="硬舉"><option value="臥推"><option value="肩推">
            <option value="啞鈴划船"><option value="二頭彎舉"><option value="三頭下拉">
            <option value="滑輪下拉"><option value="腿推舉"><option value="側平舉">
        </datalist>

        <div id="lastRecord"></div>

        <div class="input-group">
            <input type="number" id="weight" placeholder="重量 (kg)">
            <input type="number" id="reps" placeholder="次數">
            <input type="number" id="sets" placeholder="組數">
        </div>

        <button class="btn-save" onclick="saveData('weight')">儲存紀錄</button>

        <div class="timer-box">
            <span>☕ 休息</span>
            <span id="timerDisplay" class="timer-display">60</span>
            <button class="btn-timer" onclick="toggleTimer()">開始</button>
            <button class="btn-timer" onclick="resetTimer()">重置</button>
        </div>
    </div>

    <div class="card">
        <div class="calendar-header">
            <button style="width:auto; padding:5px 10px; background:#333; color:#fff;" onclick="changeMonth(-1)">◀</button>
            <span id="monthLabel" style="font-weight:bold; font-size:16px;">2024年 1月</span>
            <button style="width:auto; padding:5px 10px; background:#333; color:#fff;" onclick="changeMonth(1)">▶</button>
        </div>
        
        <div class="calendar-grid" id="calendar">
            </div>

        <h3 style="margin-top:20px; border-top:1px solid #333; padding-top:15px;">
            📝 當日紀錄
            <span id="selectedDateLabel" style="font-size:14px; color:var(--primary);"></span>
        </h3>
        <div id="logList"></div>
    </div>

    <div class="card">
        <h3>🏃 有氧 / 其他</h3>
        <div class="input-group">
            <input type="text" id="cardio" placeholder="項目 (如: 跑步)">
            <input type="number" id="minutes" placeholder="時間 (分)">
        </div>
        <button class="btn-save" style="background:var(--sec);" onclick="saveData('cardio')">儲存有氧</button>
    </div>

    <button onclick="clearAllData()" style="background:none; color:var(--danger); border:1px solid #444; margin-bottom:30px;">⚠️ 清空所有資料</button>

    <div id="deleteModal" class="modal">
        <div class="modal-content">
            <div style="font-size:18px; font-weight:bold; color:#fff; margin-bottom:10px;">確定刪除？</div>
            <div style="font-size:14px; color:#aaa;">這筆紀錄將無法復原</div>
            <div class="modal-btns">
                <button class="btn-save" style="background:#444; color:#fff;" onclick="closeModal()">取消</button>
                <button class="btn-save" style="background:var(--danger); color:#fff;" onclick="confirmDelete()">刪除</button>
            </div>
        </div>
    </div>

    <script>
        let logs = JSON.parse(localStorage.getItem('workout_logs') || "[]");
        let timerInterval;
        let timeLeft = 60;
        let isTimerRunning = false;
        let currentYear, currentMonth;
        let selectedDateStr = null; // 當前選中的日期 (格式: YYYY/MM/DD)
        let deleteTargetIndex = null; // 要刪除的 index

        // 初始化
        window.onload = function() {
            const now = new Date();
            currentYear = now.getFullYear();
            currentMonth = now.getMonth();
            // 預設選中今天
            selectedDateStr = `${currentYear}/${(currentMonth+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')}`;
            
            renderCalendar();
            renderLogs();
        };

        // --- 1. 儲存功能 (升級版) ---
        function saveData(type) {
            const now = new Date();
            const dateStr = `${now.getFullYear()}/${(now.getMonth()+1).toString().padStart(2,'0')}/${now.getDate().toString().padStart(2,'0')}`;
            const timeStr = `${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            let content = "";

            if (type === 'weight') {
                const ex = document.getElementById('exercise').value.trim();
                const w = document.getElementById('weight').value;
                const r = document.getElementById('reps').value;
                const s = document.getElementById('sets').value || "1"; // 預設1組
                if(!ex || !w || !r) return alert("請輸入完整內容！");
                // 格式：[日期 時間] 動作: 重量kg x 次數 x 組數
                content = `[${dateStr} ${timeStr}] ${ex}: ${w}kg x ${r}次 x ${s}組`;
            } else {
                const c = document.getElementById('cardio').value.trim();
                const m = document.getElementById('minutes').value;
                if(!c || !m) return alert("請輸入完整內容！");
                content = `[${dateStr} ${timeStr}] ${c}: ${m}分鐘`;
            }

            logs.unshift(content);
            localStorage.setItem('workout_logs', JSON.stringify(logs));
            
            // 儲存後更新介面
            selectedDateStr = dateStr; // 自動跳轉到今天
            renderCalendar();
            renderLogs();
            document.querySelectorAll('input').forEach(i => i.value = '');
            document.getElementById('lastRecord').innerHTML = ''; // 清空提示
        }

        // --- 2. 歷史提示功能 ---
        function checkHistory() {
            const inputVal = document.getElementById('exercise').value.trim();
            const hintBox = document.getElementById('lastRecord');
            if (!inputVal) { hintBox.innerHTML = ""; return; }

            // 搜尋包含此動作名稱的最新一筆紀錄
            const found = logs.find(log => log.includes(inputVal) && log.includes('kg'));
            
            if (found) {
                // 嘗試擷取 : 後面的內容
                const details = found.split(']:')[1] || found.split(']')[1]; 
                hintBox.innerHTML = `上次紀錄: <span>${details}</span>`;
            } else {
                hintBox.innerHTML = "尚未有此動作紀錄";
            }
        }

        // --- 3. 計時器功能 ---
        function toggleTimer() {
            const btn = document.querySelector('.btn-timer');
            if (isTimerRunning) {
                clearInterval(timerInterval);
                isTimerRunning = false;
                btn.innerText = "繼續";
                btn.classList.remove('timer-active');
            } else {
                if (timeLeft <= 0) timeLeft = 60;
                isTimerRunning = true;
                btn.innerText = "暫停";
                btn.classList.add('timer-active');
                timerInterval = setInterval(() => {
                    timeLeft--;
                    document.getElementById('timerDisplay').innerText = timeLeft;
                    if (timeLeft <= 0) {
                        clearInterval(timerInterval);
                        isTimerRunning = false;
                        btn.innerText = "完成";
                        btn.classList.remove('timer-active');
                        // 可選：播放音效或震動 navigator.vibrate(200);
                    }
                }, 1000);
            }
        }

        function resetTimer() {
            clearInterval(timerInterval);
            isTimerRunning = false;
            timeLeft = 60;
            document.getElementById('timerDisplay').innerText = 60;
            document.querySelector('.btn-timer').innerText = "開始";
            document.querySelector('.btn-timer').classList.remove('timer-active');
        }

        // --- 4. 月曆系統 (核心) ---
        function changeMonth(delta) {
            currentMonth += delta;
            if (currentMonth > 11) { currentMonth = 0; currentYear++; }
            else if (currentMonth < 0) { currentMonth = 11; currentYear--; }
            renderCalendar();
        }

        function renderCalendar() {
            const firstDay = new Date(currentYear, currentMonth, 1).getDay(); // 當月1號星期幾
            const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate(); // 當月幾天
            const container = document.getElementById('calendar');
            const label = document.getElementById('monthLabel');
            
            label.innerText = `${currentYear}年 ${currentMonth + 1}月`;
            container.innerHTML = '';

            // 星期標頭
            const weekDays = ['日', '一', '二', '三', '四', '五', '六'];
            weekDays.forEach(d => container.innerHTML += `<div class="day-name">${d}</div>`);

            // 空白補位
            for (let i = 0; i < firstDay; i++) {
                container.innerHTML += `<div></div>`;
            }

            // 產生日期
            for (let d = 1; d <= daysInMonth; d++) {
                const dateStr = `${currentYear}/${(currentMonth+1).toString().padStart(2,'0')}/${d.toString().padStart(2,'0')}`;
                
                // 檢查這天有沒有運動紀錄 (透過字串比對)
                const hasData = logs.some(log => log.includes(`[${dateStr}`));
                const isSelected = (dateStr === selectedDateStr);
                const isToday = (new Date().toDateString() === new Date(currentYear, currentMonth, d).toDateString());

                let className = 'day';
                if (isToday) className += ' today';
                if (hasData) className += ' has-data';
                if (isSelected) className += ' selected';

                container.innerHTML += `<div class="${className}" onclick="selectDate('${dateStr}')">${d}</div>`;
            }
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar(); // 重繪以顯示選取狀態
            renderLogs(); // 過濾當天紀錄
        }

        // --- 5. 顯示紀錄 (根據選中日期過濾) ---
        function renderLogs() {
            const container = document.getElementById('logList');
            const label = document.getElementById('selectedDateLabel');
            
            // 找出選中日期的所有紀錄
            // 如果沒選日期 (null)，預設顯示所有 (或是顯示今天，這裡設定為顯示選中日期的)
            if (!selectedDateStr) return;

            label.innerText = `(${selectedDateStr})`;
            
            // 篩選符合字串 "[YYYY/MM/DD" 的紀錄
            // 注意：要保留原始 index 以便刪除
            const filteredLogs = logs.map((log, index) => ({ log, index }))
                                     .filter(item => item.log.includes(`[${selectedDateStr}`));

            if (filteredLogs.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#666; padding:20px;">這天沒有紀錄喔 😴</div>';
                return;
            }

            container.innerHTML = filteredLogs.map(item => {
                // 解析顯示內容，把日期時間跟內容分開
                // 格式: [2024/01/01 12:00] 內容...
                const parts = item.log.match(/\[(.*?)\] (.*)/);
                const dateTime = parts ? parts[1] : "";
                const content = parts ? parts[2] : item.log;
                const timeOnly = dateTime.split(' ')[1] || dateTime; // 只顯示時間

                return `
                <div class="log-item">
                    <div>
                        <span class="log-date">${timeOnly}</span>
                        <span class="log-info">${content}</span>
                    </div>
                    <button class="del-btn" onclick="askDelete(${item.index})">🗑️</button>
                </div>
            `}).join('');
        }

        // --- 6. 刪除邏輯 ---
        function askDelete(index) {
            deleteTargetIndex = index;
            document.getElementById('deleteModal').style.display = 'flex';
        }

        function confirmDelete() {
            if (deleteTargetIndex !== null) {
                logs.splice(deleteTargetIndex, 1);
                localStorage.setItem('workout_logs', JSON.stringify(logs));
                // 如果刪光了當天紀錄，這天在月曆上的綠點要消失，所以要全部重繪
                renderCalendar(); 
                renderLogs();
            }
            closeModal();
        }

        function closeModal() {
            document.getElementById('deleteModal').style.display = 'none';
            deleteTargetIndex = null;
        }

        function clearAllData() {
            if (confirm("⚠️ 警告：這會刪除「所有日期」的紀錄，確定嗎？")) {
                localStorage.removeItem('workout_logs');
                logs = [];
                renderCalendar();
                renderLogs();
            }
        }
    </script>
</body>
</html>
