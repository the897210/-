<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2906/2906496.png">
    <link rel="icon" type="image/png" href="https://cdn-icons-png.flaticon.com/512/2906/2906496.png">
    <meta name="theme-color" content="#bb86fc">

    <title>💪 專屬健身 App</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --primary: #03dac6; --secondary: #bb86fc; --text: #ffffff; }
        body { font-family: -apple-system, sans-serif; padding: env(safe-area-inset-top) 20px 40px 20px; background: var(--bg-color); color: var(--text); margin: 0; overflow-x: hidden; }
        .card { background: var(--card-bg); padding: 20px; border-radius: 24px; margin-bottom: 20px; border: 1px solid #333; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
        h2 { text-align: center; color: var(--secondary); margin: 25px 0; font-size: 28px; }
        h3 { margin-top: 0; font-size: 18px; color: #eee; }
        input { width: 100%; padding: 16px; margin: 10px 0; border: none; border-radius: 14px; background: #2c2c2c; color: white; font-size: 16px; box-sizing: border-box; outline: none; }
        input:focus { box-shadow: 0 0 0 2px var(--secondary); }
        button { background: var(--primary); color: #000; border: none; padding: 16px; border-radius: 14px; width: 100%; font-size: 17px; font-weight: bold; margin-top: 12px; cursor: pointer; }
        
        .log-item { background: #2c2c2c; padding: 14px; border-radius: 12px; margin-bottom: 10px; border-left: 5px solid var(--secondary); display: flex; justify-content: space-between; align-items: center; }
        .del-btn { background: none; color: #ff5252; width: auto; padding: 5px 10px; margin: 0; font-size: 20px; border: none; }
        #history { max-height: 350px; overflow-y: auto; margin-top: 15px; }
    </style>
</head>
<body>
    <h2>💪 專屬健身 App</h2>
    <div class="card">
        <h3>🏋️ 重量訓練紀錄</h3>
        <input type="text" id="exercise" placeholder="動作名稱 (如：深蹲)">
        <input type="number" id="weight" placeholder="重量 (kg)">
        <input type="number" id="reps" placeholder="次數">
        <button onclick="saveData()">儲存紀錄</button>
    </div>

    <div class="card">
        <h3>📅 歷史紀錄</h3>
        <div id="history"></div>
        <button style="background:none; color:#ff5252; border: 1px solid #444;" onclick="clearAll()">清空所有數據</button>
    </div>

    <script>
        window.onload = display;
        function saveData() {
            const ex = document.getElementById('exercise').value;
            const w = document.getElementById('weight').value;
            const r = document.getElementById('reps').value;
            if(!ex || !w) return alert("請輸入內容");
            const now = new Date();
            const time = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`;
            const record = `[${time}] ${ex}: ${w}kg x ${r}下`;
            let logs = JSON.parse(localStorage.getItem('workout_logs') || "[]");
            logs.unshift(record);
            localStorage.setItem('workout_logs', JSON.stringify(logs));
            display();
            document.querySelectorAll('input').forEach(i => i.value = '');
        }
        function display() {
            const logs = JSON.parse(localStorage.getItem('workout_logs') || "[]");
            const container = document.getElementById('history');
            if (logs.length === 0) { container.innerHTML = '<div style="text-align:center;color:#888;">暫無紀錄</div>'; return; }
            container.innerHTML = logs.map((item, i) => `
                <div class="log-item">
                    <span>${item}</span>
                    <button class="del-btn" onclick="deleteItem(${i})">🗑️</button>
                </div>
            `).join('');
        }
        function deleteItem(i) {
            if(confirm("確定刪除此條紀錄？")) {
                let logs = JSON.parse(localStorage.getItem('workout_logs') || "[]");
                logs.splice(i, 1);
                localStorage.setItem('workout_logs', JSON.stringify(logs));
                display();
            }
        }
        function clearAll() {
            if(confirm("確定清空全部？")) { localStorage.removeItem('workout_logs'); display(); }
        }
    </script>
</body>
</html>
