<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#bb86fc">
    
    <link rel="manifest" href="manifest.json">
    
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="icon" type="image/svg+xml" href="icon.svg">

    <title>💪 專屬健身 App</title>
    <style>
        :root { --bg-color: #121212; --card-bg: #1e1e1e; --primary: #03dac6; --secondary: #bb86fc; --text: #ffffff; --danger: #cf6679; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: env(safe-area-inset-top) 20px 40px 20px; 
            background: var(--bg-color); color: var(--text); margin: 0; 
            -webkit-tap-highlight-color: transparent; user-select: none;
        }
        .card { 
            background: var(--card-bg); padding: 20px; border-radius: 20px; 
            margin-bottom: 20px; border: 1px solid #333; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.3); 
        }
        h2 { text-align: center; color: var(--secondary); margin: 20px 0; font-size: 26px; }
        h3 { margin-top: 0; font-size: 18px; color: #eee; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 15px;}
        
        input { 
            width: 100%; padding: 14px; margin: 8px 0; border: 1px solid #333; 
            border-radius: 12px; background: #2c2c2c; color: white; 
            font-size: 16px; box-sizing: border-box; outline: none; 
        }
        input:focus { border-color: var(--secondary); background: #333; }
        
        button.save-btn { 
            background: var(--primary); color: #000; border: none; padding: 16px; 
            border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; 
            margin-top: 15px; cursor: pointer; 
        }
        button.save-btn:active { transform: scale(0.98); opacity: 0.9; }

        #history { max-height: 400px; overflow-y: auto; margin-top: 10px; }
        .log-item { 
            background: #2a2a2a; padding: 12px; border-radius: 10px; 
            margin-bottom: 8px; border-left: 4px solid var(--secondary); 
            display: flex; justify-content: space-between; align-items: center; 
        }
        .log-text { font-size: 14px; line-height: 1.4; flex: 1; padding-right: 10px; }
        
        .del-btn { 
            background: none; border: none; font-size: 18px; cursor: pointer; padding: 8px; 
        }

        /* --- 客製化彈窗 (去除網址文字) --- */
        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px);
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal-box {
            background: #2a2a2a; padding: 25px; border-radius: 16px; 
            width: 80%; max-width: 320px; text-align: center; border: 1px solid #444;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        .modal-title { font-size: 18px; margin-bottom: 20px; color: #fff; font-weight: bold; }
        .modal-actions { display: flex; gap: 10px; justify-content: center; }
        .modal-btn { 
            flex: 1; padding: 12px; border-radius: 10px; border: none; 
            font-size: 15px; font-weight: bold; cursor: pointer;
        }
        .btn-cancel { background: #444; color: #fff; }
        .btn-confirm { background: var(--danger); color: #fff; }
    </style>
</head>
<body>
    <h2>💪 專屬健身 App</h2>
    
    <div class="card">
        <h3>🏋️ 重量訓練</h3>
        <input type="text" id="exercise" placeholder="動作 (例: 深蹲)">
        <input type="number" id="weight" placeholder="重量 (kg)">
        <input type="number" id="reps" placeholder="次數">
        <button class="save-btn" onclick="saveData('weight')">儲存重訓紀錄</button>
    </div>

    <div class="card">
        <h3>🏃 有氧運動</h3>
        <input type="text" id="cardio" placeholder="項目 (例: 跑步)">
        <input type="number" id="minutes" placeholder="時間 (分鐘)">
        <button class="save-btn" style="background: var(--secondary);" onclick="saveData('cardio')">儲存有氧紀錄</button>
    </div>

    <div class="card">
        <h3>📅 歷史紀錄</h3>
        <div id="history"></div>
        <button onclick="confirmClearAll()" style="background:none; color:var(--danger); border:1px solid #444; width:100%; padding:10px; border-radius:10px; margin-top:20px;">⚠️ 清空所有資料</button>
    </div>

    <div id="customModal" class="modal-overlay">
        <div class="modal-box">
            <div id="modalText" class="modal-title">確定要刪除嗎？</div>
            <div class="modal-actions">
                <button class="modal-btn btn-cancel" onclick="closeModal()">取消</button>
                <button id="confirmBtn" class="modal-btn btn-confirm">確定刪除</button>
            </div>
        </div>
    </div>

    <script>
        let deleteIndex = null;
        let isClearAll = false;

        window.onload = display;

        function saveData(type) {
            let record = "";
            const now = new Date();
            const time = `${now.getMonth()+1}/${now.getDate()} ${now.getHours().toString().padStart(2,'0')}:${now.getMinutes().toString().padStart(2,'0')}`;
            
            if (type === 'weight') {
                const ex = document.getElementById('exercise').value;
                const w = document.getElementById('weight').value;
                const r = document.getElementById('reps').value;
                if(!ex || !w) return;
                record = `[${time}] ${ex}: ${w}kg x ${r}下`;
            } else {
                const c = document.getElementById('cardio').value;
                const m = document.getElementById('minutes').value;
                if(!c || !m) return;
                record = `[${time}] ${c}: ${m}分鐘`;
            }

            let logs = JSON.parse(localStorage.getItem('workout_logs') || "[]");
            logs.unshift(record);
            localStorage.setItem('workout_logs', JSON.stringify(logs));
            display();
            document.querySelectorAll('input').forEach(i => i.value = '');
        }

        function display() {
            const logs = JSON.parse(localStorage.getItem('workout_logs') || "[]");
            const container = document.getElementById('history');
            if (logs.length === 0) {
                container.innerHTML = '<div style="text-align:center; color:#666; padding:20px;">尚無紀錄</div>';
                return;
            }
            container.innerHTML = logs.map((item, index) => `
                <div class="log-item">
                    <span class="log-text">${item}</span>
                    <button class="del-btn" onclick="openDeleteModal(${index})">🗑️</button>
                </div>
            `).join('');
        }

        const modal = document.getElementById('customModal');
        const modalText = document.getElementById('modalText');
        const confirmBtn = document.getElementById('confirmBtn');

        function openDeleteModal(index) {
            deleteIndex = index;
            isClearAll = false;
            modalText.innerText = "確定要刪除這筆紀錄嗎？";
            modal.style.display = "flex";
            confirmBtn.onclick = executeDelete;
        }

        function confirmClearAll() {
            isClearAll = true;
            modalText.innerText = "⚠️ 確定要刪除「全部」資料嗎？";
            modal.style.display = "flex";
            confirmBtn.onclick = executeDelete;
        }

        function closeModal() {
            modal.style.display = "none";
            deleteIndex = null;
        }

        function executeDelete() {
            let logs = JSON.parse(localStorage.getItem('workout_logs') || "[]");
            if (isClearAll) {
                localStorage.removeItem('workout_logs');
            } else if (deleteIndex !== null) {
                logs.splice(deleteIndex, 1);
                localStorage.setItem('workout_logs', JSON.stringify(logs));
            }
            display();
            closeModal();
        }
    </script>
</body>
</html>
