<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    
    <link rel="apple-touch-icon" href="https://cdn-icons.png/flatic 512/2906/2906496.png
    <link rel="icon" href="https://cdn-icons-png.flaticon.com/512/2906/2906496.png">

    <title>我的運動日誌</title>
    <style>
        /* 讓介面更像原生 App */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            padding: env(safe-area-inset-top) 20px 20px 20px; 
            background: #121212; 
            color: white; 
            margin: 0;
            user-select: none;
        }
        .card { background: #1e1e1e; padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid #333; }
        h2 { text-align: center; color: #bb86fc; margin-top: 20px; }
        input { 
            width: 100%; padding: 15px; margin: 10px 0; 
            border: none; border-radius: 12px; background: #2c2c2c; 
            color: white; font-size: 16px; box-sizing: border-box;
        }
        button { 
            background: #03dac6; color: #000; border: none; padding: 15px; 
            border-radius: 12px; width: 100%; font-size: 16px; font-weight: bold; margin-top: 10px;
        }
        .log-item { background: #2c2c2c; padding: 12px; border-radius: 10px; margin-bottom: 8px; font-size: 14px; }
        #history { max-height: 250px; overflow-y: auto; }
    </style>
</head>
<body>
    <h2>💪 專屬健身 App</h2>
    
    <div class="card">
        <h3>🏋️ 重量訓練</h3>
        <input type="text" id="exercise" placeholder="動作名稱">
        <input type="number" id="weight" placeholder="重量 (kg)">
        <input type="number" id="reps" placeholder="次數">
        <button onclick="saveData('weight')">儲存紀錄</button>
    </div>

    <div class="card">
        <h3>🏃 有氧/設定</h3>
        <input type="text" id="cardio" placeholder="運動類型">
        <input type="number" id="minutes" placeholder="時間 (分鐘)">
        <button style="background: #bb86fc;" onclick="saveData('cardio')">儲存有氧</button>
    </div>

    <div class="card">
        <h3>📅 歷史數據</h3>
        <div id="history"></div>
        <button style="background:none; color:#ff5252; font-size:12px;" onclick="clearHistory()">清空所有數據</button>
    </div>

    <script>
        window.onload = displayHistory;
        function saveData(type) {
            let record = "";
            const now = new Date();
            const timeStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${now.getMinutes()}`;
            if (type === 'weight') {
                const ex = document.getElementById('exercise').value;
                const w = document.getElementById('weight').value;
                const r = document.getElementById('reps').value;
                if(!ex || !w) return;
                record = `[${timeStr}] ${ex}: ${w}kg x ${r}下`;
            } else {
                const c = document.getElementById('cardio').value;
                const m = document.getElementById('minutes').value;
                if(!c || !m) return;
                record = `[${timeStr}] ${c}: ${m}分鐘`;
            }
            let history = JSON.parse(localStorage.getItem('workout_logs') || "[]");
            history.unshift(record);
            localStorage.setItem('workout_logs', JSON.stringify(history));
            displayHistory();
            // 清空輸入框
            document.querySelectorAll('input').forEach(i => i.value = '');
        }
        function displayHistory() {
            const history = JSON.parse(localStorage.getItem('workout_logs') || "[]");
            const container = document.getElementById('history');
            container.innerHTML = history.map(item => `<div class="log-item">${item}</div>`).join('');
        }
        function clearHistory() {
            if(confirm("確定刪除嗎？")) { localStorage.removeItem('workout_logs'); displayHistory(); }
        }
    </script>
</body>
</html>
